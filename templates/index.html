<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JCP CHAT | Justin Chachap</title>
    <style>
        /* 
           ========================================
           CORE SYSTEM VARIABLES
           ========================================
        */
        :root {
            --primary: #4285f4;
            --pi: #34a853;
            --si: #fbbc05;
            --secondary: #9b51e0;
            --bg: #0b0d0e; 
            --glass: rgba(255, 255, 255, 0.05);
            --glow: #4285f4; 
            --error: #ff4d4d;
            --panel-bg: #1a1c1e;
            --border: rgba(255, 255, 255, 0.1);
        }

        /* 
           ========================================
           RESET & GLOBAL STYLES
           ========================================
        */
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0;
        }
        
        html, body {
            height: 100dvh; 
            width: 100vw; 
            overflow: hidden; 
            background: var(--bg);
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; 
            flex-direction: column;
        }

        /* 
           ========================================
           HEADER DESIGN (Pill Menu & Wallet)
           ========================================
        */
        header {
            flex-shrink: 0; 
            padding: 12px 15px;
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(20px);
            box-shadow: 0 0 10px var(--glow);
            border-bottom: 1px solid var(--bg);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            flex-direction: column;
        }

        .gemini-logo {
            font-size: 18px; 
            font-weight: 800; 
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--pi), var(--si), var(--pi));
            background-size: 200% auto; 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; 
            animation: shine 5s linear infinite;
        }

        .author-tag {
            font-size: 9px; 
            opacity: 0.7; 
            font-weight: bold; 
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        /* Pill Hamburger Menu */
        .menu-wrapper {
            position: relative;
        }

        .pill-menu-btn {
            background: var(--panel-bg);
            border: 1.5px solid var(--glow);
            border-radius: 50px;
            padding: 10px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .pill-menu-btn:hover {
            padding: 13px 22px;
            background: var(--glow):
            border-color: var(--glow);
            box-shadow: 0 0 20px var(--glow);
        }

        .hamburger-icon {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hamburger-icon span {
            display: block;
            width: 18px;
            height: 2px;
            background: white;
            border-radius: 2px;
        }

        /* Dropdown Social Menu */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 55px;
            background: #1e1f20;
            border: 1.5px solid var(--glow);
            border-radius: 12px;
            z-index: 1000;
            min-width: 160px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: pop 0.2s ease-out;
        }

        .dropdown-item {
            display: block;
            padding: 14px 18px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: var(--glow);
            box-shadow: 0 0 20px var(--glow);
        }
        /* Outlined Wallet Button */
        .wallet-link {
            position: relative;
            display: flex;
            background: var(--panel-bg);
            border: 1.5px solid var(--glow);
            align-items: center;
            gap: 6px;
            text-decoration: var(--glow);
            color: #ffffff;
            padding: 7px 9px;
            border-radius: 40px;
            transition: all 0.2s ease;
        }

        .wallet-link:hover {
            border: 1.5px solid var(--glow);
            background: var(--panel-bg);
            box-shadow: 0 0 20px var(--glow);
            border-radius: 40px;
            padding: 9px 11px;
            display: flex;
        }

        .wallet-icon {
            width: 22px;
            height: 22px;
            stroke-width: 1.5;
        }

        .wallet-text {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* 
           ========================================
           CHAT AREA
           ========================================
        */
        #chat-box {
            flex: 1; 
            overflow-y: auto;
            padding: 20px 15px;
            display: flex; 
            flex-direction: column; 
            gap: 18px;
            scrollbar-width: none; 
            scroll-behavior: smooth;
        }

        #chat-box::-webkit-scrollbar { 
            display: none; 
        }

        .msg-container { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            max-width: 85%; 
        }

        .user-container { 
            align-self: flex-end; 
        }

        .bot-container { 
            align-self: flex-start; 
        }

        .message {
            padding: 12px 18px; 
            border-radius: 20px; 
            font-size: 15px; 
            line-height: 1.6;
            animation: pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.08); 
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-msg { 
            background: #2b2d31; 
            border-bottom-right-radius: 4px; 
            color: #efefef;
        }

        .bot-msg { 
            background: var(--glass); 
            border-bottom-left-radius: 4px;
            border-left: 3px solid var(--glow); 
        }

        /* Alert System Message Styles */
        .alert-msg {
            border-left: 3px solid var(--error) !important;
            background: rgba(255, 77, 77, 0.08) !important;
            color: #ffcccc;
            font-weight: 500;
        }

        /* 
           ========================================
           INTERACTIVE ACTIONS (Copy/Retry)
           ========================================
        */
        .message-actions { 
            display: flex; 
            gap: 8px; 
            opacity: 0; 
            transition: opacity 0.2s; 
            padding-left: 5px; 
            margin-top: 2px;
        }

        .msg-container:hover .message-actions,
        .bot-container.is-alert .message-actions { 
            opacity: 1; 
        }

        .action-btn {
            background: rgba(255,255,255,0.08); 
            border: 1px solid var(--glow);
            color: white; 
            width: 34px; 
            height: 34px; 
            border-radius: 8px;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--glow);
            border-color: var(--glow);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
        }

        /* 
           ========================================
           INPUT SECTION
           ========================================
        */
        .input-area {
            flex-shrink: 0; 
            padding: 15px; 
            display: flex; 
            gap: 12px;
            background: #16181c; 
            border-top: 1px solid var(--border);
            padding-bottom: max(15px, env(safe-area-inset-bottom));
        }

        input {
            flex: 1; 
            padding: 14px 22px; 
            border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.1);
            background: #1e1f20; 
            color: white; 
            outline: none; 
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--glow);
        }

        #sendBtn {
            background: var(--glow); 
            border: none; 
            width: 50px; 
            height: 50px; 
            border-radius: 50%;
            color: white; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s, opacity 0.2s;
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #sendBtn:active {
            transform: scale(0.9);
        }

        /* 
           ========================================
           UTILITIES & ANIMATIONS
           ========================================
        */
        .copy-feedback { 
            position: fixed; 
            bottom: 100px; 
            right: 20px; 
            background: var(--glow); 
            color: white; 
            padding: 10px 20px; 
            border-radius: 10px; 
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out; 
            z-index: 2000; 
        }

        @keyframes shine { 
            to { background-position: 200% center; } 
        }
        
        @keyframes pop { 
            from { opacity:0; transform:scale(0.95) translateY(10px); } 
            to { opacity:1; transform:scale(1) translateY(0); } 
        }
        
        @keyframes slideIn { 
            from { transform: translateY(30px); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }
    </style>
</head>
<body>

    <div id="chat-box" role="log" aria-live="polite">
        <!-- Initial Message -->
        <div class="msg-container bot-container">

        </div>

    <form class="input-area" id="chatForm">
        <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" required aria-label="Message input">
        <button type="submit" id="sendBtn" title="Send message">✔</button>
    </form>

    <!-- 
       ========================================
       CORE LOGIC SCRIPT
       ========================================
    -->
    <script>
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatForm = document.getElementById('chatForm');
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');

        let lastUserMessage = '';

        /* 
           Dropdown Menu Logic
        */
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isVisible = dropdownMenu.style.display === 'block';
            dropdownMenu.style.display = isVisible ? 'none' : 'block';
        });

        document.addEventListener('click', () => {
            dropdownMenu.style.display = 'none';
        });

        /* 
           Core UI Messenger Logic
        */
        function addMessage(text, type, isError = false) {
            const container = document.createElement('div');
            container.className = `msg-container ${type}-container ${isError ? 'is-alert' : ''}`;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}-msg ${isError ? 'alert-msg' : ''}`;
            msgDiv.textContent = text;
            container.appendChild(msgDiv);
            
            // Add Interactive Actions to Bot Responses & Alerts
            if (type === 'bot') {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                
                // Copy Action
                const copyBtn = document.createElement('button');
                copyBtn.className = 'action-btn';
                copyBtn.innerHTML = '📋';
                copyBtn.title = 'Copy to clipboard';
                copyBtn.onclick = (e) => {
                    e.preventDefault();
                    navigator.clipboard.writeText(text).then(() => {
                        showCopyFeedback();
                    });
                };

                // Retry Action
                const retryBtn = document.createElement('button');
                retryBtn.className = 'action-btn';
                retryBtn.innerHTML = '🔄';
                retryBtn.title = 'Retry last request';
                retryBtn.onclick = (e) => {
                    e.preventDefault();
                    if (lastUserMessage) {
                        handleRetry(lastUserMessage);
                    }
                };

                actionsDiv.appendChild(copyBtn);
                actionsDiv.appendChild(retryBtn);
                container.appendChild(actionsDiv);
            }
            
            chatBox.appendChild(container);
            
            // Auto-scroll to bottom
            chatBox.scrollTo({ 
                top: chatBox.scrollHeight, 
                behavior: 'smooth' 
            });
        }

        function showCopyFeedback() {
            const feedback = document.createElement('div');
            feedback.className = 'copy-feedback';
            feedback.textContent = '✓ Copied';
            document.body.appendChild(feedback);
            
            setTimeout(() => {
                feedback.style.opacity = '0';
                setTimeout(() => feedback.remove(), 300);
            }, 2000);
        }

        function handleRetry(msgText) {
            if (sendBtn.disabled) return;
            
            // Remove the last bot response (usually the alert)
            const botMessages = document.querySelectorAll('.bot-container');
            if (botMessages.length > 0) {
                botMessages[botMessages.length - 1].remove();
            }
            
            requestAIResponse(msgText);
        }

        async function requestAIResponse(text) {
            lastUserMessage = text;
            
            msgInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '...';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                
                if (response.ok && data.response) {
                    addMessage(data.response, 'bot');
                } else {
                    const errorMsg = data.error || "Please try again.";
                    addMessage(`[ALERT]: ${errorMsg}`, 'bot', true);
                }
            } catch (err) {
                console.error('Request failed:', err);
                addMessage("[ALERT]: Please check your internet🛰 connection and try again.", 'bot', true);
            } finally {
                msgInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = '✔';
              /*  msgInput.focus();*/
            }
        }

        /* 
           Form Interaction
        */
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            
            if (!text || sendBtn.disabled) return;

            addMessage(text, 'user');
            msgInput.value = '';
            
            requestAIResponse(text);
        });

        /* 
           Dynamic Theme Glow Logic
        */
        const themeColors = ['#4285f4', '#9b51e0', '#34a853', '#fbbc05'];
        let colorIndex = 0;
        
        setInterval(() => {
            colorIndex = (colorIndex + 1) % themeColors.length;
            document.documentElement.style.setProperty('--glow', themeColors[colorIndex]);
        }, 8000);

    </script>
</body>
