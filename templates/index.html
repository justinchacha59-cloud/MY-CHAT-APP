<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4285f4">
    <meta name="description" content="JCP CHAT - AI-powered Progressive Web App with Llama 3 AI integration. Made by Justin Chachap">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JCP CHAT">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/static/icon-192x192.png">
    <link rel="apple-touch-icon" href="/static/icon-192x192.png">
    
    <title>JCP CHAT | Justin Chachap</title>
    <style>
        /* Core CSS omitted for brevity (kept same as existing file) */
        :root{--primary:#4285f4;--pi:#34a853;--si:#fbbc05;--secondary:#9b51e0;--bg:#0b0d0e;--glass:rgba(255,255,255,0.05);--glow:#4285f4;--error:#ff4d4d;--panel-bg:#1a1c1e;--border:rgba(255,255,255,0.1)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
        html,body{height:100dvh;width:100vw;overflow:hidden;background:var(--bg);color:white;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
        header{flex-shrink:0;padding:12px 15px;background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);box-shadow:0 0 10px var(--glow);border-bottom:1px solid var(--bg);display:flex;justify-content:flex-start;align-items:center;z-index:100;padding-top:max(12px,env(safe-area-inset-top))}
        .logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--glow);box-shadow:0 0 15px var(--glow);animation:glow-pulse 2s ease-in-out infinite}
        .brand-container{display:flex;padding:0 50px 0 4px;flex-direction:column;align-items:flex-start}
        .gemini-logo{font-size:18px;font-weight:bold;letter-spacing:0.5px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--pi),var(--si),var(--pi));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 5s linear infinite}
        .author-tag{font-size:9px;opacity:0.7;font-weight:bold}
        .header-controls{display:flex;align-items:center;gap:8px;margin-left:auto}
        .pill-menu-btn{background:var(--panel-bg);border:1.5px solid var(--glow);border-radius:50px;padding:9px 17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
        .dropdown-menu{display:none;position:absolute;right:0;top:55px;background:#1e1f20;border:1.5px solid var(--glow);border-radius:12px;z-index:1000;min-width:180px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.5)}
        .dropdown-item{display:block;padding:12px 16px;color:white;text-decoration:none;font-size:13px;font-weight:500;border-bottom:1px solid rgba(255,255,255,0.05)}
        .dropdown-item:last-child{border-bottom:none}
        #chat-box{flex:1;overflow-y:auto;padding:20px 15px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
        .msg-container{display:flex;flex-direction:column;gap:6px;max-width:85%}
        .user-container{align-self:flex-end}
        .bot-container{align-self:flex-start}
        .message{padding:12px 18px;border-radius:20px;font-size:15px;line-height:1.6;border:1px solid rgba(255,255,255,.08);white-space:pre-wrap}
        .user-msg{background:#2b2d31;border-bottom-right-radius:4px;color:#efefef}
        .bot-msg{background:var(--glass);border-bottom-left-radius:4px;border-left:3px solid var(--glow)}
        .alert-msg{border-left:3px solid var(--error)!important;background:rgba(255,77,77,.08)!important;color:#ffcccc}
        .message-actions{display:flex;gap:8px;opacity:0;transition:opacity .2s;padding-left:5px;margin-top:2px}
        .msg-container:hover .message-actions{opacity:1}
        .action-btn{background:rgba(255,255,255,.08);border:1px solid var(--glow);color:white;width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .input-area{flex-shrink:0;padding:15px;display:flex;gap:12px;background:#16181c;border-top:1px solid var(--border);padding-bottom:max(15px,env(safe-area-inset-bottom))}
        input{flex:1;padding:14px 22px;border-radius:30px;border:1px solid rgba(255,255,255,.1);background:#1e1f20;color:white;outline:none;font-size:16px}
        #sendBtn{background:var(--glow);border:none;width:50px;height:50px;border-radius:50%;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
        .copy-feedback{position:fixed;bottom:100px;right:20px;background:var(--glow);color:white;padding:10px 20px;border-radius:10px;font-weight:600;box-shadow:0 5px 15px rgba(0,0,0,.3);z-index:2000}
        @keyframes shine{to{background-position:200% center}}@keyframes glow-pulse{0%,100%{box-shadow:0 0 30px var(--glow),0 0 60px rgba(66,133,244,.3)}50%{box-shadow:0 0 50px var(--glow),0 0 100px rgba(66,133,244,.5)}}
    </style>
</head>
<body>
    <header>
       <img src="/static/image.jpg" alt="logo" class="logo">
        <div class="brand-container">
            <div class="gemini-logo">JCP CHAT</div>
            <div class="author-tag">Made by Jûstîn Çhãçhãp</div>
        </div>
        
        <div class="header-controls">
            <!-- Pill-shaped Menu -->
            <div class="menu-wrapper">
                <button id="menuBtn" class="pill-menu-btn" aria-label="Open Social Menu">
                    <div class="hamburger-icon">
                        <span style="display:block;width:18px;height:2px;background:#fff;margin:3px 0;border-radius:2px"></span>
                        <span style="display:block;width:18px;height:2px;background:#fff;margin:3px 0;border-radius:2px"></span>
                        <span style="display:block;width:18px;height:2px;background:#fff;margin:3px 0;border-radius:2px"></span>
                    </div>
                </button>
                <div id="dropdownMenu" class="dropdown-menu">
                    <a href="https://airtelafrica.onelink.me/cGyr/ptnx2qxw?af_referrer_uid=RD2MKC3D" target="_blank" class="dropdown-item">Airtel app</a>
                    <a href="https://www.facebook.com/justin.chachap" target="_blank" class="dropdown-item">Facebook</a>
                    <a href="https://www.instagram.com/justin_chacha.p" target="_blank" class="dropdown-item">Instagram</a>
                    <a href="https://www.tiktok.com/@justinchachap" target="_blank" class="dropdown-item">TikTok</a>
                    <button id="clearHistoryBtn" class="dropdown-item" style="background:none;border:none;text-align:left;cursor:pointer">Clear History</button>
                </div>
            </div>

            <!-- Outlined Wallet Link -->
            <a href="https://link.minipay.xyz/invite?ref=5K4QpNaw" class="wallet-link" target="_blank" style="display:flex;align-items:center;gap:6px;text-decoration:none;color:#fff;padding:6px 8px;border-radius:40px;border:1.5px solid var(--glow)">
                <svg class="wallet-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path></svg>
                <span class="wallet-text">Wallet</span>
            </a>
        </div>
    </header>

    <div id="chat-box" role="log" aria-live="polite">
        <!-- Initial Message -->
        <div class="msg-container bot-container">
            <div class="message bot-msg">Hello! This is JCP CHAT. How can I help you today?</div>
        </div>
    </div>

    <form class="input-area" id="chatForm">
        <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" required aria-label="Message input">
        <button type="submit" id="sendBtn" title="Send message">✔</button>
    </form>

    <script>
    // PWA service worker registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/static/service-worker.js')
                .then((reg) => console.log('ServiceWorker registered', reg))
                .catch((err) => console.warn('SW registration failed', err));
        });
    }

    // Keys and limits
    const HISTORY_KEY = 'jcp_chat_history_v1';
    const CLIENT_ID_KEY = 'jcp_chat_client_id_v1';
    const MAX_CLIENT_HISTORY = 500; // stored locally
    const MAX_HISTORY_SEND = 10;    // sent to model

    // DOM refs
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatForm = document.getElementById('chatForm');
    const menuBtn = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    // state
    let chatHistory = []; // {role:'user'|'bot', content:'', ts: ms}
    let lastUserMessage = '';

    // helper: uuid for client_id
    function generateUUID() {
        // simple RFC4122 v4 compliant-ish
        return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (
            c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
    }

    function getClientId() {
        let id = localStorage.getItem(CLIENT_ID_KEY);
        if (!id) {
            try { id = generateUUID(); } catch (e) { id = 'cid-' + Date.now(); }
            localStorage.setItem(CLIENT_ID_KEY, id);
        }
        return id;
    }

    const CLIENT_ID = getClientId();

    // History storage helpers
    function loadLocalHistory() {
        try {
            const raw = localStorage.getItem(HISTORY_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
        } catch (e) { console.warn('loadLocalHistory failed', e); }
        return [];
    }

    function saveLocalHistory() {
        try {
            // keep bounded
            if (chatHistory.length > MAX_CLIENT_HISTORY) chatHistory = chatHistory.slice(-MAX_CLIENT_HISTORY);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(chatHistory));
        } catch (e) { console.warn('saveLocalHistory failed', e); }
    }

    function appendToHistory(role, content, ts = Date.now()) {
        const entry = { role, content, ts };
        chatHistory.push(entry);
        if (chatHistory.length > MAX_CLIENT_HISTORY) chatHistory = chatHistory.slice(-MAX_CLIENT_HISTORY);
        saveLocalHistory();
    }

    // Render helpers
    function showCopyFeedback() {
        const f = document.createElement('div');
        f.className = 'copy-feedback';
        f.textContent = '✓ Copied';
        document.body.appendChild(f);
        setTimeout(() => { f.style.opacity = '0'; setTimeout(() => f.remove(), 300); }, 1400);
    }

    function addMessage(text, type, isError = false, save = true) {
        const container = document.createElement('div');
        container.className = `msg-container ${type}-container ${isError ? 'is-alert' : ''}`;

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}-msg ${isError ? 'alert-msg' : ''}`;
        msgDiv.textContent = text;
        container.appendChild(msgDiv);

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'message-actions';

        // copy button for both user & bot
        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn';
        copyBtn.title = 'Copy to clipboard';
        copyBtn.innerHTML = '📋';
        copyBtn.onclick = (e) => { e.preventDefault(); navigator.clipboard.writeText(text).then(showCopyFeedback).catch(showCopyFeedback); };
        actionsDiv.appendChild(copyBtn);

        // retry only for bot
        if (type === 'bot') {
            const retryBtn = document.createElement('button');
            retryBtn.className = 'action-btn';
            retryBtn.title = 'Retry last request';
            retryBtn.innerHTML = '🔄';
            retryBtn.onclick = (e) => { e.preventDefault(); if (lastUserMessage) handleRetry(lastUserMessage); };
            actionsDiv.appendChild(retryBtn);
        }

        container.appendChild(actionsDiv);
        chatBox.appendChild(container);

        if (save) appendToHistory(type === 'assistant' ? 'bot' : type, text, Date.now());

        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    }

    function renderHistory() {
        chatBox.innerHTML = '';
        if (!chatHistory || !chatHistory.length) return;
        chatHistory.forEach(item => {
            const role = (item.role === 'bot' || item.role === 'assistant') ? 'bot' : 'user';
            addMessage(item.content, role, false, false);
        });
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'auto' });
    }

    // Merge server history + local history, dedupe by ts+content
    function mergeAndSaveHistories(local, server) {
        const combined = (local || []).concat(server || []);
        // sort by ts
        combined.sort((a,b)=> (a.ts||0)-(b.ts||0));
        // dedupe
        const seen = new Set();
        const out = [];
        for (const e of combined) {
            const key = `${e.role}::${e.content}::${e.ts}`;
            if (!seen.has(key)) { seen.add(key); out.push(e); }
        }
        chatHistory = out.slice(-MAX_CLIENT_HISTORY);
        saveLocalHistory();
    }

    // Server history endpoints
    async function loadServerHistory() {
        try {
            const res = await fetch('/history/load', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ client_id: CLIENT_ID }) });
            if (!res.ok) return [];
            const data = await res.json();
            return data.history || [];
        } catch (e) { console.warn('loadServerHistory failed', e); return []; }
    }

    async function clearServerHistory() {
        try {
            await fetch('/history/clear', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ client_id: CLIENT_ID }) });
        } catch (e) { console.warn('clearServerHistory failed', e); }
    }

    // Clear both local and server histories
    async function handleClearHistory() {
        const ok = confirm('Clear all chat history locally and on server? This cannot be undone.');
        if (!ok) return;
        chatHistory = [];
        saveLocalHistory();
        renderHistory();
        await clearServerHistory();
        alert('History cleared');
    }

    clearHistoryBtn.addEventListener('click', (e) => { e.preventDefault(); handleClearHistory(); });

    // Retry logic
    function handleRetry(msgText) {
        if (sendBtn.disabled) return;
        // remove last bot message from DOM
        const botMessages = document.querySelectorAll('.bot-container');
        if (botMessages.length) botMessages[botMessages.length-1].remove();
        // remove last bot from history
        for (let i = chatHistory.length - 1; i >= 0; i--) {
            if (chatHistory[i].role === 'bot') { chatHistory.splice(i,1); saveLocalHistory(); break; }
        }
        requestAIResponse(msgText);
    }

    // Send message to server with history
    async function requestAIResponse(text) {
        lastUserMessage = text;
        msgInput.disabled = true; sendBtn.disabled = true; sendBtn.innerHTML = '...';

        try {
            const historyToSend = chatHistory.slice(-MAX_HISTORY_SEND);
            const res = await fetch('/ask', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ message: text, history: historyToSend, client_id: CLIENT_ID }) });
            const data = await res.json();
            if (res.ok && data.response) {
                addMessage(data.response, 'bot', false, true);
            } else {
                addMessage(`[ALERT]: ${data.error||'Please try again.'}`, 'bot', true, true);
            }
        } catch (err) {
            console.error('Request failed:', err);
            addMessage('[ALERT]: Please check your internet connection and try again.', 'bot', true, true);
        } finally {
            msgInput.disabled = false; sendBtn.disabled = false; sendBtn.innerHTML = '✔';
        }
    }

    // Form handler
    chatForm.addEventListener('submit', (e)=>{ e.preventDefault(); const text = msgInput.value.trim(); if (!text) return; addMessage(text, 'user', false, true); msgInput.value=''; requestAIResponse(text); });

    // Dropdown toggle
    menuBtn.addEventListener('click', (e)=>{ e.stopPropagation(); dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block'; });
    document.addEventListener('click', ()=> dropdownMenu.style.display = 'none');

    // Theme glow cycle
    const themeColors = ['#4285f4','#9b51e0','#34a853','#fbbc05']; let colorIndex=0; setInterval(()=>{ colorIndex=(colorIndex+1)%themeColors.length; document.documentElement.style.setProperty('--glow', themeColors[colorIndex]); },8000);

    // Init on load: merge server & local history, then render
    window.addEventListener('load', async ()=>{
        const local = loadLocalHistory();
        const server = await loadServerHistory();
        mergeAndSaveHistories(local, server);
        renderHistory();
    });
    </script>
</body>
</html>
